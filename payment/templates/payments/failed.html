<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <title>Payment Failed</title>

    </head>

    <body>
        <h1>Payment Failed</h1>

        {% if messages %}

            {% for message in messages %}

                <p>
                    {{ message }}
                </p>

            {% endfor %}

        {% endif %}


        <a href="{% url 'checkout' %}">
            Try Again
        </a>

    </body>

</html>
