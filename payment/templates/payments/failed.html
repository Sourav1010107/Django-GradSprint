<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <title>Payment Failed</title>
    </head>

    <body>
        <h2>Payment Failed</h2>

        {% if messages %}

            {% for message in messages %}

                <p>
                    {{ message }}
                </p>

            {% endfor %}

        {% endif %}


        <a href="{% url 'checkout' %}">
            Try Again
        </a>
    </body>
</html>
