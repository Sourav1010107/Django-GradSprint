{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRE-Practice-Test</title>
    <link rel="stylesheet" href="{% static 'gradsprint/css/calculator.css'%}">
    <link rel="stylesheet" href="{% static 'gradsprint/css/style.css'%}">
    <script src= "{% static 'gradsprint/js/questions.js'%}"></script>
    <script src= "{% static 'gradsprint/js/calculator.js'%}" defer></script>
    <script src="{% static 'gradsprint/js/choiceRendering.js'%}"></script>
    <script src="{% static 'gradsprint/js/testRendering.js'%}"></script>
    
</head>

<body>
    <header>
        <div id="test-header">
            <div id="section-header">

                <div id="nav" class="nav-bar">
                    <h1 class="test-title">GRE Practice Test</h1>

                    <span></span>
                    <button id="quit" class="button-bar">Quit</button>
                    <button id="end-section" class="button-bar">End Sec.</button>
                    <button id="calculator-button" class="button-bar">Clac</button>
                    <button id="mark" class="button-bar">Mark</button>
                    <button id="review" class="button-bar">Review</button>
                    <button id="previous" class="button-bar">Prev</button>
                    <button id="next" class="button-bar">Next</button>
                </div>           

                <div id="review-nav" class="review-nav-bar hidden">
                    <h1 class="test-title">GRE Practice Test</h1>

                    <button id="quit-r" class="button-bar">Quit</button>
                    <button id="end-section-r" class="button-bar">End Sec.</button>
                    <button id="go-question" class="button-bar">Go to Question</button>
                </div>

                <div class="time-area">
                    <p id="question-number"></p>
                    <button id="hide" class="button-hide">Hide</button>
                    <p class="time">
                    <span>Time Remaining</span>
                    <span id="timer"></span> 
                    </p>

                </div>

            </div>
        </div>
    </header>

    <!--CALCULATOR-->

    <div id="calculator" class="calculator hidden">

        <div id="calculator-header" class="calculator-header">
            Calculator
            <button id="calculator-close" type="button">×</button>
        </div>

        <input type="text" id="calculator-display" readonly>

        <div class ="calculator-buttons">

            <button type="button" data-action="clear">C</button>
            <button type="button" data-action="backspace">⌫</button>
            <button type="button" data-action="sqrt">√</button>
            <button type="button" data-value="/">÷</button>

            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button type="button" data-value="*">×</button>

            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" data-value="-">−</button>

            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" data-value="+">+</button>

            <button type="button" data-action="sign">±</button>
            <button type="button" data-value="0">0</button>
            <button type="button" data-value=".">.</button>
            <button type="button" data-action="equals">=</button>

            <button type="button" data-action="percent">%</button>
        </div>
    </div>

    <div id="test-prompt">

        <button id="start-section">START TEST</button>

        <div id="section-prompt">

            <div id="main-prompt">

                <div class="question-area">

                    <div id="passage" class="passage-container">
                    </div>
                    
                    <div id="question-box" class="question-container">
                    <p id="instruction"></p>
                    <p id="image"></p>
                    <p id="question"></p>

                        <!-- Quantitative Comparison area -->
                        <div id="quantity-comparison" class="quantity-comparison">

                            <div class="quantity-box">

                                <div class="quantity-title">
                                    Quantity A
                                </div>

                                <div id="quantity-a" class="quantity-value">
                                </div>
                            </div>


                            <div class="quantity-box">

                                <div class="quantity-title">
                                    Quantity B
                                </div>

                                <div id="quantity-b" class="quantity-value">
                                </div>

                            </div>
                        </div>
                        <!--finish quant comparison section-->
                    
                    <p id="choices"></p>
                    </div>
    
                </div>

            </div>

            <div id="modal" class="hidden">
                <p>Review List</p>
                <br>
                <table id="review-table">
                    <thead>
                        <tr>
                            <th>Question No</th>
                            <th>Status</th>
                            <th>Marked</th> 
                        </tr>
                    </thead>
                    <tbody id="review-table-body">
                    </tbody>
                </table>
                <button id="close-Review" class="review-bttn-close">Close</button>
            </div>
        </div>
    </div>

    <div id="section-exit" class="section-exit hidden">
        <h4>Are you sure, you want to EXIT SECTION?</h4>
        <button id="sec-yes" class="button-bar">Yes</button>
        <button id="sec-no" class="button-bar">Cancel</button>
    </div>

    <div id="test-exit" class="test-exit hidden">
        <h4>Are you sure, you want to EXIT SECTION?</h4>
        <button id="test-yes" class="button-bar">Yes</button>
        <button id="test-no" class="button-bar">Cancel</button>
    </div>
  
</body>
</html>
